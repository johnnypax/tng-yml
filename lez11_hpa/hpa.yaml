apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lez09-isolation-hpa
  namespace: lez09-sms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lez09-isolation-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 5