apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lez09-isolation-hpa
  namespace: lez09-sms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lez09-isolation-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 2
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies: 
        - type: Percent     # Puoi aumentare le repliche fino al 100% di quelle che hai ogni 15 secondi
          value: 100        # 1 -> 2 -> 4 -> 8
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
        