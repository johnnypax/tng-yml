apiVersion: apps/v1
kind: Deployment
metadata:
  name: scuola-be-deployment
  namespace: scuola-ns
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: scuola-ws-pod          # *
  template:                       # Specifica template del POD
    metadata:
      labels:
        app: scuola-ws-pod        # *
    spec:
      containers:
        - name: scuola-ws-pod     # arbitrario
          image: nginx:1.25
          ports:
            - containerPort: 80
  