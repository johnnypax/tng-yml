apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: school-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sms-mysql
  template:
    metadata:
      labels:
        app: sms-mysql
    spec:
      containers:
        - name: sms-mysql
          image: mysql:8.4
      ports:
        - containerPort: 3306