apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: school-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sms-mysql
  template:
    metadata:
      labels:
        app: sms-mysql
    spec:
      containers:
        - name: sms-mysql
          image: mysql:8.4
          ports:  
          - containerPort: 3306

          envFrom:
            - configMapRef:
                name: mysql-configmap
            - secretRef:
                name: mysql-secrets

          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 5
              
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-persistent-volume-claim