apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rest-hpa
  namespace: school-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rest-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies: 
        - type: Percent     # Puoi aumentare le repliche fino al 100% di quelle che hai ogni 15 secondi
          value: 100        # 2 -> 4 -> 8
          periodSeconds: 15
        - type: Pods        # Aumenta il numero di POD due alla volta ogni 15 sec max
          value: 2          # 2 -> 4 -> 6
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies: 
        - type: Percent  
          value: 50   
          periodSeconds: 15
        - type: Pods     
          value: 1     
          periodSeconds: 15