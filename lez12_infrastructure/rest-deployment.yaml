apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-deployment
  namespace: school-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sms-rest
  template:
    metadata:
      labels:
        app: sms-rest
    spec:
      containers:
      - name: sms-rest
        image: archety/student-api-mysql:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

        env:
          - name: APP_PROFILE
            valueFrom:
              configMapKeyRef:
                name: mysql-configmap
                key: APP_PROFILE
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name: mysql-configmap
                key: SPRING_DATASOURCE_URL
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: mysql-secrets
                key: SPRING_DATASOURCE_USERNAME
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secrets
                key: SPRING_DATASOURCE_PASSWORD

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10


        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            memory: "1Gi"
            cpu: "500m"
